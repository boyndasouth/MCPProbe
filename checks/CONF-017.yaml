id: CONF-017
title: Results identify the server in _meta serverInfo
severity: warn
era: modern
spec_ref: https://modelcontextprotocol.io/specification/2026-07-28/basic/index#meta
description: Calls server/discover and, if tools are declared, tools/list. Servers SHOULD
  include io.modelcontextprotocol/serverInfo in every result's _meta.
