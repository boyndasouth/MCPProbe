id: CONF-003
title: Unsupported protocol version returns -32022 with data.supported
severity: error
era: modern
spec_ref: https://modelcontextprotocol.io/specification/2026-07-28/basic/versioning#protocol-version-negotiation
description: Sends an ordinary request (tools/list, prompts/list or resources/list, whichever
  the server declares; server/discover if none) declaring protocol version 1900-01-01. The
  server MUST answer with UnsupportedProtocolVersionError (-32022) whose data lists the supported
  versions and echoes the requested one; on HTTP with status 400. On stdio the request is the
  first one a fresh server process receives, so a server that only goes wrong after earlier
  requests is reported by CONF-020 instead. Over HTTP the probe cannot restart the server, and
  earlier cases may have sent valid requests.
