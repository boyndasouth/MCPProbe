id: CONF-007
title: Origin header is validated on Streamable HTTP
severity: error
era: modern
spec_ref: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#security--endpoint
transports:
- http
description: 'Sends a valid request with Origin: https://mcpprobe-rebind.invalid. Servers
  MUST validate Origin to prevent DNS rebinding and MUST answer an invalid Origin with HTTP
  403. Runs on modern servers only until legacy checks land in M2.'
