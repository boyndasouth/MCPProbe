id: CONF-005
title: 'Request ids: null is rejected and responses echo the id exactly'
severity: error
era: both
spec_ref: https://modelcontextprotocol.io/specification/2026-07-28/basic/index#requests
description: 'Sends a request with id null, which MUST NOT be accepted (an error or no answer
  both pass; a result fails). Then sends a string id with non-ASCII characters and a large
  integer id; responses MUST carry the same id, with the same JSON type. The rule is identical
  in 2025-11-25 (https://modelcontextprotocol.io/specification/2025-11-25/basic#requests).
  On servers that speak both eras it runs twice: once with modern requests, and once inside
  a legacy initialize session as <ID>@legacy.'
