[project]
name = "mcpprobe"
version = "0.1.0"
description = "Conformance checker, schema fuzzer and tool-usability evaluator for MCP servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shiwin" }]
# Development targets 3.12; the CI matrix covers 3.11-3.13 per the spec.
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "conformance", "fuzzing", "testing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Every dependency is pure Python or ships prebuilt wheels for Windows, macOS
# and Linux, so `pip install mcpprobe` never needs a compiler.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "hypothesis>=6.100",
    "hypothesis-jsonschema>=0.23",
    "jinja2>=3.1",
    "sarif-om>=1.0.4",
]

[project.optional-dependencies]
# The EVAL suite is the only one that calls a model API; keep it opt-in.
eval = ["anthropic>=0.40"]

[project.scripts]
mcpprobe = "mcpprobe.cli:app"

[project.urls]
Homepage = "https://github.com/boyndasouth/MCPProbe"
Issues = "https://github.com/boyndasouth/MCPProbe/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "syrupy>=4.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpprobe"]

# The check catalog lives at the repo root (checks/) so adding a check never
# touches the engine; the wheel ships it as package data.
[tool.hatch.build.targets.wheel.force-include]
"checks" = "mcpprobe/_checks"

[tool.hatch.build.targets.sdist]
include = ["src", "checks", "tests", "fixtures", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "TC", "PTH", "N", "C4", "PIE", "RET"]
ignore = [
    "B008", # Typer declares options as default-argument calls
    "N818", # TransportTimeout reads better than TransportTimeoutError
]

[tool.ruff.lint.per-file-ignores]
# Typer inspects annotations at runtime, so their imports must stay real.
"src/mcpprobe/cli.py" = ["TC003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hypothesis_jsonschema.*", "sarif_om.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["mcpprobe"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
