name: Release

# Push a tag like v1.0.0 to build, smoke-test on every OS, publish to PyPI as
# mcpprobe-kit (trusted publishing: no API token is stored anywhere), and
# create a GitHub release with the wheel and sdist attached.
#
# Every artifact gets a signed build-provenance attestation (Sigstore), on
# PyPI (PEP 740) and on GitHub. Check one with:
#   gh attestation verify mcpprobe_kit-1.0.0-py3-none-any.whl --repo boyndasouth/MCPProbe
#
# One-time setup, before the first tag:
# - pypi.org -> Your account -> Publishing -> add a pending publisher:
#   project mcpprobe-kit, owner boyndasouth, repository MCPProbe,
#   workflow release.yml, environment pypi
# - GitHub -> Settings -> Environments -> New environment: pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # to sign the attestation
      attestations: write   # to store it on GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match the package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: uv build
      - name: Sign build provenance for the wheel and sdist
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel (binary dependencies only) and run it
        shell: bash
        run: |
          python -m venv .smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin=.smoke/Scripts; py=.smoke/Scripts/python.exe
          else
            bin=.smoke/bin; py=.smoke/bin/python
          fi
          "$py" -m pip install --only-binary=:all: dist/*.whl
          "$bin/mcpprobe" --version
          "$bin/mcpprobe" checks list
          # The reference server passes every check, so this must exit 0.
          "$bin/mcpprobe" run --stdio "$py -u fixtures/servers/reference.py" --seed 1

  pypi:
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcpprobe-kit/
    permissions:
      id-token: write   # trusted publishing; also signs the PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^(## )?\[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "MCPProbe $GITHUB_REF_NAME" \
            --notes-file notes.md
