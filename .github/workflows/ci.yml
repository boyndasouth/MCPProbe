name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      # Spec: 90%+ line coverage on engine/ and transport/.
      - run: >-
          uv run pytest -q
          --cov=mcpprobe.engine --cov=mcpprobe.transport
          --cov-report=term --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      # The wheel must ship the check catalog and install without a compiler.
      - run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --only-binary=:all: dist/*.whl
          /tmp/wheel-env/bin/mcpprobe --version
          /tmp/wheel-env/bin/mcpprobe checks list
