site_name: MCPProbe
site_description: Conformance, fuzzing, robustness and security checks for MCP servers
site_url: https://boyndasouth.github.io/MCPProbe/
repo_url: https://github.com/boyndasouth/MCPProbe
repo_name: boyndasouth/MCPProbe
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - content.code.copy
    - navigation.sections
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Quickstart: index.md
  - Using it in CI: ci.md
  - Configuration: configuration.md
  - Reports: reports.md
  - Calling tools safely: safety.md
  - Check catalog: checks/index.md
  - Decisions and departures: decisions.md
  - "Release gate: public servers": gate-m4.md

not_in_nav: |
  checks/*.md
